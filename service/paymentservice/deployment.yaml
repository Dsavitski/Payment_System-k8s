apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: payment-system
  labels:
    app: paymentservice
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
        tier: app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: paymentservice
          image: ghcr.io/dsavitski/payment-system-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: paymentservice-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"